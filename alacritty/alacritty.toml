# Alacritty on Linux and macOS (linked to ~/.config/alacritty/alacritty.toml on both).
# TOML has no if/else: what differs per platform is in platform.toml, linked from linux.toml or
# macos.toml (links.txt). Colours: theme.toml, generated by `theme` (~/System/dotfiles/themes).
[general]
import = ["~/.config/alacritty/theme.toml", "~/.config/alacritty/platform.toml"]

[font]
# Chinese falls back to the system CJK font (alacritty has no fallback setting)
normal.family = "PxPlus IBM VGA 8x16"
