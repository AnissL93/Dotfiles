[general]
# colours come from the current theme, generated by `theme` (~/System/dotfiles/themes)
import = ["~/.config/alacritty/theme.toml"]

[font]
normal = { family = "PxPlus IBM VGA 8x16" }
size = 20.0025   # pt, = 26.67px

[window]
padding = { x = 24, y = 24 }   # CRT bezel feel

[cursor]
style = { shape = "Block", blinking = "On" }

[colors]
draw_bold_text_with_bright_colors = true
