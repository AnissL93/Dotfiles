# kitty on macOS: the st of the Linux desktop (desktop/linux/st), with st's link and output keys.
# Linked to ~/.config/kitty/kitty.conf (links.txt). Colours: ~/.config/theme/kitty.conf, written by `theme`.

# same font as st and Alacritty: IBM VGA, 24 pt = 3x its 8x16 grid on Retina; Chinese in Cubic 11
font_family      PxPlus IBM VGA 8x16
font_size        24
symbol_map U+2E80-U+2FDF,U+3000-U+303F,U+3040-U+30FF,U+3100-U+312F,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF Cubic 11

background_opacity        0.9
window_padding_width      10
hide_window_decorations   titlebar-only
macos_option_as_alt       yes
# one kitty process for every window: a new one starts in ~1 s, a window in an existing one at once.
# cmd-enter (aerospace.toml) asks it over this socket; kitty stays running with no windows.
macos_quit_when_last_window_closed no
allow_remote_control socket-only
listen_on unix:/tmp/kitty-$USER
enable_audio_bell         no
# as Alacritty; ssh hosts have no xterm-kitty terminfo
term xterm-256color

# st keys (Mod = alt): alt-l open a link, alt-y copy a link (letter labels instead of dmenu),
# alt-o copy the last command's output (shell integration marks the prompts)
map alt+l kitten hints --type url --program default
map alt+y kitten hints --type url --program @
map alt+o launch --stdin-source=@last_cmd_output --type=clipboard

include ~/.config/theme/kitty.conf
