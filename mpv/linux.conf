# Linux only (linked as part of dotfiles/mpv on L; the include in mpv.conf is skipped where it is missing)
# Hybrid Intel/NVIDIA X11 setup:
# - vulkan: swapchain creation fails ("Could not initialize video chain")
# - vo=gpu-next + opengl: garbled frames, desktop shows through, flicker
# - vo=gpu + opengl: clean
vo=gpu
gpu-api=opengl
# /etc/mpv/mpv.conf sets hwdec=vaapi, which has no driver on the NVIDIA GPU
hwdec=nvdec
# Bilibili logged-in qualities; yt-dlp finds the default profile under ~/.config/mozilla itself
ytdl-raw-options=cookies-from-browser=firefox
# ~/.local/bin may not be on PATH when Firefox (ff2mpv) starts mpv
script-opts-append=ytdl_hook-ytdl_path=/home/hy/.local/bin/yt-dlp
