# Amber CRT, light: amber ink on warm paper. Monochrome like amber.conf: darkness carries meaning
# (keywords and functions darkest, comments faint). Hand-made in OKLCH (H 55–85), no design line.
# color7/color15 ("white") are dark: prompts print text in bold white.
base            = amber
name            = Amber CRT Light
mode            = light
emacs_theme     = doom-amber-crt-light
cursor          = AmberCRTLight

bg        = #fbf3e1
bg_alt    = #f4ead5
bg_hl     = #eee2c9
sel       = #e6c99a
dim       = #c8b494
mid       = #90693b
fg        = #4d2d05
bright    = #2b1401
accent    = #975800
accent_fg = #fbf3e1
border    = #af7200

comment   = #9f8056
string    = #754c00
number    = #994a00
keyword   = #442600
function  = #321c04
type      = #6e4200
punct     = #845922
err       = #a83a00
warn      = #994a00
ok        = #754c00

color0  = #2b1401
color1  = #a83a00
color2  = #754c00
color3  = #975800
color4  = #6e4200
color5  = #845922
color6  = #90693b
color7  = #90693b
color8  = #9f8056
color9  = #994a00
color10 = #754c00
color11 = #af7200
color12 = #6e4200
color13 = #975800
color14 = #845922
color15 = #4d2d05
