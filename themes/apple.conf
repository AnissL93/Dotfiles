# Poison apple: porcelain-white skin, apple red, turquoise hair, deep teal shadows, ink.
# Light; apple-dark.conf is the dark version.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=200 base_c=.008 accent=25 border=185 syntax=25,215,180,330,60  (colours computed by ./design)
name            = Poison Apple
mode            = light
emacs_theme     = doom-apple
cursor          = PoisonApple
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/apple-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/apple-3440.png

bg        = #eff5f5
bg_alt    = #e5eded
bg_hl     = #dce5e5
sel       = #e8cdca
dim       = #aab3b3
mid       = #5c6d6d
fg        = #242d2e
bright    = #111a1b
accent    = #855450
accent_fg = #fbf5f5
border    = #5d8a84

comment   = #7e8989
string    = #246e62
number    = #805632
keyword   = #864f4b
function  = #206b7b
type      = #795075
punct     = #596667
err       = #9c4343
warn      = #805632
ok        = #3c6c53

color0  = #111a1b
color1  = #895151
color2  = #426f4c
color3  = #7a5e2e
color4  = #3c688b
color5  = #76557e
color6  = #1f7074
color7  = #5c6d6d
color8  = #7e8989
color9  = #a06a69
color10 = #5c8664
color11 = #907649
color12 = #567fa1
color13 = #8d6d94
color14 = #42878b
color15 = #242d2e
