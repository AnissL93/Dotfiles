# Aqua city: girl in a red hoodie over a drowned teal city, whale, bubbles — vapor graded:
# the wallpaper is multiplied with an east gradient #ffcfe8→#d8d0ff (pink→lilac sky).
# Light; aqua-dark.conf is the dark version.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=330 accent=22 border=195 syntax=15,255,195,300,65  (colours computed by ./design)
name            = Aqua City
mode            = light
emacs_theme     = doom-aqua
cursor          = AquaCity
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/aqua-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/aqua-3440.png

bg        = #f7f1f6
bg_alt    = #f0e8ef
bg_hl     = #e9e0e7
sel       = #e8cdcb
dim       = #b7aeb5
mid       = #736371
fg        = #312830
bright    = #1d151d
accent    = #855452
accent_fg = #fbf5f5
bar       = #a8353a
bar_fg    = #fbf5f5
border    = #008384

comment   = #8d828c
string    = #1c6e6e
number    = #7e5730
keyword   = #864e53
function  = #43628a
type      = #675685
punct     = #6b5f6a
err       = #9c4343
warn      = #7e5730
ok        = #3c6c53

color0  = #1d151d
color1  = #a8353b
color2  = #007567
color3  = #8e5400
color4  = #0064b5
color5  = #7947a5
color6  = #007375
color7  = #736371
color8  = #8d828c
color9  = #bb5757
color10 = #00907f
color11 = #ab6a00
