# Arroyo: sunlit canyon creek — cream sky, rust-orange hoodoos, sage scrub, turquoise water. arroyo-dark.conf is the shadowed tree side.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=75 accent=40 border=200 syntax=35,215,130,290,70  (colours computed by ./design)
name            = Arroyo
mode            = light
emacs_theme     = doom-arroyo
cursor          = Arroyo
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/arroyo-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/arroyo-3440.png

bg        = #f7f3ed
bg_alt    = #f0eae3
bg_hl     = #e9e2d9
sel       = #e7cec6
dim       = #b7b0a7
mid       = #736756
fg        = #312a21
bright    = #1e170e
accent    = #835647
accent_fg = #fbf5f4
bar       = #a63c0c
bar_fg    = #fbf5f4
border    = #008388

comment   = #8d857a
string    = #52693a
number    = #7c592e
keyword   = #855043
function  = #206b7b
type      = #605988
