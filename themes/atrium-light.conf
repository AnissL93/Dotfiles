# Atrium, light: sunlit blinds — pale blue paper, lacquer-red accent, cerulean border.
# Same wallpaper as atrium.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=230 base_c=.01 accent=20 border=228 syntax=17,240,145,351,65  (colours computed by ./design)
base            = atrium
name            = Atrium Light
mode            = light
emacs_theme     = doom-atrium-light
cursor          = AtriumLight

bg        = #eff4f7
bg_alt    = #e5edf1
bg_hl     = #dbe5e9
sel       = #e8cdcc
dim       = #aab3b7
mid       = #5b6c75
fg        = #232d32
bright    = #111a1e
accent    = #845454
accent_fg = #fbf5f5
bar       = #a8353e
bar_fg    = #fbf5f5
border    = #007ea8

comment   = #7d888e
string    = #446c45
number    = #7e5730
keyword   = #864e51
function  = #356687
type      = #814e66
punct     = #58666d
err       = #9c4343
warn      = #7e5730
ok        = #3c6c53

color0  = #111a1e
color1  = #a8353e
color2  = #027827
color3  = #8e5400
color4  = #0069ab
color5  = #99397b
color6  = #00708a
color7  = #5b6c75
color8  = #7d888e
color9  = #bb565a
color10 = #3e8e49
color11 = #ab6a00
color12 = #1682c0
color13 = #ad5890
color14 = #0089a9
