# Balcony, light: the beige building in daylight, teal accent, balloon-red border. Same wallpaper.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=70 accent=210 border=25 syntax=25,210,150,290,65  (colours computed by ./design)
