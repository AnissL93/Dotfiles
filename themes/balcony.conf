# Balcony: a girl on a balcony with red balloons, deep teal sky, telephone poles.
# Dark: ink-navy base, balloon-red accent, teal border. balcony-light.conf is the light one.
# 3440 pads only the left (sky side) with a blur.
# design: dark base=230 accent=25 accent_l=.52 accent_c=.12 border=210 syntax=25,210,150,290,65  (colours computed by ./design)
name            = Balcony
mode            = dark
emacs_theme     = doom-balcony
cursor          = Balcony
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/balcony-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/balcony-3440.png

bg        = #10222a
bg_alt    = #0b1a22
bg_hl     = #192c35
sel       = #463230
dim       = #40535c
mid       = #8aa3b0
fg        = #d3e0e7
bright    = #ebf3f8
accent    = #a34945
accent_fg = #fbf5f5
bar       = #af3c3a
bar_fg    = #fbf5f5
border    = #00c1da

comment   = #6a7e88
string    = #95c19d
