# Summer bookhouse: a girl reading in an ivy-covered book shack under a cumulus sky, a gull overhead.
# Light: sky-tinted paper, wood-brown ink, muted sky-blue highlight, weathered-wood border;
# syntax: rust, sky blue, ivy green, cloud lavender, ochre.
# 2560: crop focused on the top (gull + girl); 3440: full height, sides padded with blurred sky.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=235 accent=240 border=50 syntax=30,245,130,290,75  (colours computed by ./design)
name            = Summer Bookhouse
mode            = light
emacs_theme     = doom-bird
cursor          = SummerBookhouse
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/bird-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/bird-3440.png

bg        = #eef4f8
bg_alt    = #e4edf2
bg_hl     = #dae5eb
sel       = #c3d7e6
dim       = #a9b3b9
mid       = #596c78
fg        = #222d34
bright    = #101a20
accent    = #3f6885
accent_fg = #f3f7fa
bar       = #006aa7
bar_fg    = #f3f7fa
border    = #b74d00

comment   = #7c8890
