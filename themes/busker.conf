# Street Buskers. Three girls playing on a sun-faded street: dusty rose paper, navy ink, pink signs, teal sky.
# Light; busker-dark.conf is the dark version.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=watercolor base=25 accent=5 border=180 syntax=5,255,170,320,60  (colours computed by ./design)
name            = Street Buskers
mode            = light
emacs_theme     = doom-busker
cursor          = StreetBuskers
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/busker-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/busker-3440.png

bg        = #fef0ee
bg_alt    = #fae6e4
bg_hl     = #f4ddda
sel       = #f5c6cf
dim       = #c1aba9
mid       = #865d59
fg        = #3b2422
bright    = #261210
accent    = #f7acbc
accent_fg = #201417
bar       = #ffa3ba
bar_fg    = #201417
soft      = 1
border    = #008674

comment   = #9b7e7b
string    = #00755a
number    = #8c541f
keyword   = #92495b
function  = #39659b
type      = #7c4f86
punct     = #7b5a57
err       = #9c4343
warn      = #8c541f
ok        = #2b7351

color0  = #261210
color1  = #a63450
color2  = #007850
color3  = #925100
color4  = #0064b5
color5  = #874197
color6  = #00746b
color7  = #865d59
color8  = #9b7e7b
color9  = #b95569
color10 = #009265
color11 = #ad6800
color12 = #397dc4
color13 = #9c5eaa
color14 = #008f84
color15 = #3b2422
