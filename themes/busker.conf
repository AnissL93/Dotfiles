# Street Buskers. Three girls playing on a sun-faded street: dusty rose paper, navy ink, pink signs, teal sky.
# Light; busker-dark.conf is the dark version.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=25 accent=5 border=180 syntax=5,255,170,320,60  (colours computed by ./design)
name            = Street Buskers
mode            = light
emacs_theme     = doom-busker
cursor          = StreetBuskers
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/busker-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/busker-3440.png

bg        = #f9f1f1
bg_alt    = #f3e8e7
bg_hl     = #ecdfde
sel       = #e7cdd1
dim       = #baaeac
mid       = #796360
fg        = #342826
bright    = #201514
accent    = #83535e
accent_fg = #fbf5f6
bar       = #a53458
bar_fg    = #fbf5f6
border    = #008674

comment   = #928280
string    = #2c6e5a
number    = #805632
keyword   = #844e5b
function  = #43628a
type      = #73527b
punct     = #705e5c
err       = #9c4343
warn      = #805632
ok        = #3c6c53

color0  = #201514
color1  = #a63450
color2  = #007850
color3  = #925100
color4  = #0064b5
color5  = #874197
color6  = #00746b
color7  = #796360
color8  = #928280
color9  = #b95569
color10 = #009265
color11 = #ad6800
color12 = #397dc4
color13 = #9c5eaa
color14 = #008f84
color15 = #342826
