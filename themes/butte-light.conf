# Butte, light: the lit cloud — warm cream, violet ink, ember accent. Same wallpaper as butte.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=60 accent=320 border=40 syntax=20,265,90,320,50  (colours computed by ./design)
