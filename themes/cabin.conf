# Cabin: lit cabin under a starry snow night — night blue, slate hills, peach-lit clouds,
# warm window glow. cabin-light.conf is the snowfield.
# design: dark base=253 accent=48 border=200 syntax=30,230,140,290,60  (colours computed by ./design)
name            = Cabin Snow
mode            = dark
emacs_theme     = doom-cabin
cursor          = CabinSnow
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/cabin-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/cabin-3440.png

