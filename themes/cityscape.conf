# Cityscape: sun-faded anime megacity — parchment cream, jade signs, moss green, ochre, sky teal,
# rust and rainbow accents. Light; cityscape-dark.conf is the same city at night.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=100 accent=165 border=75 syntax=35,205,145,300,70  (colours computed by ./design)
name            = Cityscape
mode            = light
emacs_theme     = doom-cityscape
cursor          = Cityscape
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/cityscape-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/cityscape-3440.png

bg        = #f5f4ed
bg_alt    = #edebe3
bg_hl     = #e5e3d9
sel       = #c3dbcf
dim       = #b3b1a7
mid       = #6d6a56
fg        = #2d2c21
bright    = #1a190e
accent    = #3d6f5a
accent_fg = #f3f8f6
border    = #927c5f

comment   = #89877a
string    = #446c45
number    = #7c592e
keyword   = #855043
function  = #1c6c75
type      = #675685
punct     = #666454
err       = #9c4343
warn      = #7c592e
ok        = #3c6c53

color0  = #1a190e
color1  = #895151
color2  = #426f4c
color3  = #7a5e2e
color4  = #3c688b
color5  = #76557e
color6  = #1f7074
color7  = #6d6a56
color8  = #89877a
color9  = #a06a69
color10 = #5c8664
color11 = #907649
color12 = #567fa1
color13 = #8d6d94
color14 = #42878b
color15 = #2d2c21
