# Diagon, light: parchment under the overcast sky — sepia ink, slate-blue accent, timber border. Same wallpaper as diagon.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=75 accent=255 border=50 syntax=30,250,130,330,65  (colours computed by ./design)
base            = diagon
name            = Diagon Light
mode            = light
emacs_theme     = doom-diagon-light
cursor          = DiagonLight

bg        = #f7f3ed
bg_alt    = #f0eae3
bg_hl     = #e9e2d9
sel       = #c7d6e8
dim       = #b7b0a7
mid       = #736756
fg        = #312a21
bright    = #1e170e
accent    = #4a6588
accent_fg = #f4f7fb
bar       = #1762b6
bar_fg    = #f4f7fb
border    = #b74d00

comment   = #8d857a
