# Night fair: a girl in a striped dress at a starlit fairground (Ferris wheel, carousel, swing ride),
# all dusty plum, rose and bulb-cream. Light: rose-tinted paper, plum ink, dusty-rose highlight,
# plum border; syntax rose, dusk violet, sage, dusk blue, bulb gold. dress-dark.conf is the dark one.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=20 base_c=.012 accent=15 border=330 syntax=15,290,150,250,65  (colours computed by ./design)
name            = Night Fair
mode            = light
emacs_theme     = doom-dress
cursor          = NightFair
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/dress-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/dress-3440.png

bg        = #f9f1f1
