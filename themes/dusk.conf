# Dusk Clouds. Sunset clouds over a dark forest: slate trees, salmon-pink clouds, peach and gold sky.
# Dark; dusk-light.conf is the light version.
# design: dark base=275 accent=15 border=55 syntax=10,255,85,320,40  (colours computed by ./design)
