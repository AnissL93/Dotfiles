# Foundry, light: the dusty deck plates — sand paper, plum ink, rust orange, steel blue. Same wallpaper as foundry.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=oil base=75 accent=35 border=220 syntax=30,225,110,345,70  (colours computed by ./design)
