# Foundry, light: the dusty deck plates — sand paper, plum ink, rust orange, steel blue. Same wallpaper as foundry.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=75 accent=35 border=220 syntax=30,225,110,345,70  (colours computed by ./design)
base            = foundry
name            = Foundry Light
mode            = light
emacs_theme     = doom-foundry-light
cursor          = FoundryLight

bg        = #f7f3ed
bg_alt    = #f0eae3
bg_hl     = #e9e2d9
sel       = #e7cec7
dim       = #b7b0a7
mid       = #736756
fg        = #312a21
bright    = #1e170e
accent    = #84564a
accent_fg = #fbf5f4
bar       = #a7391e
bar_fg    = #fbf5f4
border    = #007f9e

comment   = #8d857a
string    = #63642f
number    = #7c592e
keyword   = #865047
function  = #286980
type      = #7f4f6a
punct     = #6b6254
err       = #9c4343
warn      = #7c592e
ok        = #3c6c53

color0  = #1e170e
color1  = #a83630
color2  = #576e00
color3  = #8a5700
color4  = #006d98
color5  = #963a81
color6  = #007186
color7  = #736756
