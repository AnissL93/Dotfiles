# Frost: flat-vector snow peaks under a wavy aurora — snow white, lavender-grey sky, glacier blue,
# aurora teal-to-indigo, slate outline.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=260 accent=220 border=255 syntax=270,225,175,305,45  (colours computed by ./design)
name            = Frost Peaks
mode            = light
emacs_theme     = doom-frost
cursor          = FrostPeaks
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/frost-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/frost-3440.png

bg        = #f0f4f9
