# Frost: flat-vector snow peaks under a wavy aurora — snow white, lavender-grey sky, glacier blue,
# aurora teal-to-indigo, slate outline.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=watercolor base=260 accent=220 border=255 syntax=270,225,175,305,45  (colours computed by ./design)
name            = Frost Peaks
mode            = light
emacs_theme     = doom-frost
cursor          = FrostPeaks
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/frost-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/frost-3440.png

bg        = #eef4fe
bg_alt    = #e3ecfa
bg_hl     = #d9e4f5
sel       = #addded
dim       = #a7b2c2
mid       = #566a89
fg        = #212c3d
bright    = #0f1828
accent    = #7ed2ed
accent_fg = #0e1b1f
bar       = #00d9ff
bar_fg    = #0e1b1f
soft      = 1
border    = #2171cc

comment   = #7a879c
string    = #007560
number    = #914f2f
keyword   = #4d5f9c
function  = #006e8e
type      = #715391
