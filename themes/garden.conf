# Garden of Earthly Delights (Bosch). Light: the paradise panels —
# varnish cream, grass green, fountain blue, pink towers, umber ink. garden-dark.conf is the hell panel.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=95 accent=255 border=35 syntax=30,255,130,340,70  (colours computed by ./design)
name            = Garden of Delights
mode            = light
emacs_theme     = doom-garden
cursor          = GardenDelights
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/garden-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/garden-3440.png

bg        = #f5f3ed
bg_alt    = #edebe2
bg_hl     = #e6e3d8
sel       = #c7d6e8
dim       = #b4b1a7
mid       = #6e6956
fg        = #2e2b21
bright    = #1b180e
accent    = #4a6588
accent_fg = #f4f7fb
bar       = #1762b6
bar_fg    = #f4f7fb
border    = #bc4527

comment   = #8a8679
string    = #52693a
number    = #7c592e
keyword   = #865047
function  = #43628a
type      = #7d4f6e
punct     = #676354
err       = #9c4343
warn      = #7c592e
ok        = #3c6c53

color0  = #1b180e
color1  = #a83630
color2  = #367500
color3  = #8a5700
color4  = #0064b5
color5  = #933b86
color6  = #007378
color7  = #6e6956
color8  = #8a8679
color9  = #bb584f
color10 = #558b37
color11 = #a86c00
color12 = #397dc4
color13 = #a75a9a
color14 = #008c93
color15 = #2e2b21
