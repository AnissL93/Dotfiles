# Moon Glade, light: morning mist over the glade — misty blue-lilac paper, deep indigo ink,
# glade-teal highlight, bark-lilac border.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=270 base_c=.014 accent=205 border=295 syntax=345,250,160,295,75  (colours computed by ./design)
base            = glade
name            = Moon Glade Light
mode            = light
emacs_theme     = doom-glade-light
cursor          = MoonGladeLight
bg        = #f1f3fa
bg_alt    = #e7ebf5
bg_hl     = #dee3ef
sel       = #bedade
dim       = #adb1bc
mid       = #61687e
fg        = #272b37
bright    = #141823
accent    = #2f6e75
accent_fg = #f2f8f9
border    = #827b9c

comment   = #818694
