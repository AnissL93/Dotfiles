# Hamlet, light: sunny cobble mint-cream paper, amber-brown accent, mint border.
# Same wallpaper as hamlet.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=120 base_c=.012 accent=65 border=150 syntax=35,235,127,350,80  (colours computed by ./design)
base            = hamlet
name            = Hamlet Light
mode            = light
emacs_theme     = doom-hamlet-light
cursor          = HamletLight

bg        = #f2f4ee
bg_alt    = #eaece4
bg_hl     = #e1e4da
sel       = #e3d1c0
dim       = #b0b3a9
mid       = #666c59
fg        = #2a2d22
bright    = #171a10
accent    = #7d5b3a
accent_fg = #faf6f3
bar       = #925100
bar_fg    = #faf6f3
border    = #008a39

comment   = #84887b
string    = #556838
number    = #775b2b
keyword   = #855043
function  = #306785
type      = #814e66
punct     = #616556
err       = #9c4343
warn      = #775b2b
ok        = #3c6c53

color0  = #171a10
color1  = #a83829
color2  = #00792f
color3  = #855a00
color4  = #006ba4
color5  = #98397c
color6  = #006f90
color7  = #666c59
color8  = #84887b
color9  = #bb5949
color10 = #348f4f
color11 = #a27000
color12 = #0083be
color13 = #ac5891
color14 = #0088af
color15 = #2a2d22
