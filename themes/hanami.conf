# Hanami: a cherry branch against a pink sky. Light: blush-pink paper, blossom accent, bark border.
# hanami-dark.conf is the dark one.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=5 accent=10 border=35 syntax=355,250,130,300,60  (colours computed by ./design)
name            = Hanami
mode            = light
emacs_theme     = doom-hanami
cursor          = Hanami
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/hanami-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/hanami-3440.png

bg        = #f9f1f3
bg_alt    = #f3e8ea
bg_hl     = #ecdfe1
sel       = #e7cdd0
dim       = #baadb0
mid       = #796266
fg        = #34272a
bright    = #201517
accent    = #84545b
accent_fg = #fbf5f6
bar       = #a6344f
bar_fg    = #fbf5f6
border    = #bc4527

comment   = #918284
string    = #52693a
number    = #805632
keyword   = #824e63
function  = #3e6389
type      = #675685
punct     = #705e61
err       = #9c4343
warn      = #805632
ok        = #3c6c53

color0  = #201517
color1  = #a7344a
color2  = #367500
color3  = #925100
color4  = #0066b3
color5  = #7947a5
color6  = #007378
color7  = #796266
color8  = #918284
color9  = #ba5564
color10 = #558b37
color11 = #ad6800
color12 = #307fc3
color13 = #8e64b7
color14 = #008c93
color15 = #34272a
