# Haze: Tokyo rooftops at pastel dusk with a crescent moon — lilac haze, pink concrete,
# powder-blue sky, butter-yellow walls. haze-dark.conf is the same street after dark.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=307 accent=326 border=249 syntax=348,249,190,300,75  (colours computed by ./design)
name            = Haze Rooftops
mode            = light
emacs_theme     = doom-haze
cursor          = HazeRooftops
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/haze-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/haze-3440.png

bg        = #f5f2f8
bg_alt    = #ede9f2
bg_hl     = #e5e1eb
sel       = #dfcedf
dim       = #b3afb8
mid       = #6d6577
fg        = #2e2933
bright    = #1b161f
accent    = #775677
accent_fg = #f9f5f9
bar       = #8d3e90
bar_fg    = #f9f5f9
border    = #0074c9

comment   = #89838f
string    = #1e6e6a
