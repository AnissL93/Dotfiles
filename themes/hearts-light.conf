# Pixel Hearts, light: same hues as hearts.conf, light ground. Same wallpaper.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=255 accent=310 border=180 syntax=0,310,170,220,80  (colours computed by ./design)
base            = hearts
name            = Pixel Hearts Light
mode            = light
emacs_theme     = doom-pixel-hearts-light
cursor          = PixelHeartsLight

bg        = #f0f4f9
bg_alt    = #e6ecf3
bg_hl     = #dde4ed
sel       = #dacfe3
dim       = #abb2ba
mid       = #5e6a7a
fg        = #252c35
bright    = #121921
accent    = #6f597f
accent_fg = #f8f6fa
bar       = #7d45a2
bar_fg    = #f8f6fa
border    = #008674

comment   = #7f8792
string    = #2c6e5a
number    = #775b2b
keyword   = #834e5f
function  = #6d5480
type      = #246a7e
punct     = #5a6471
err       = #9c4343
warn      = #775b2b
ok        = #3c6c53

color0  = #121921
color1  = #a53456
color2  = #007850
color3  = #855a00
color4  = #006e94
color5  = #80449f
color6  = #007186
color7  = #5e6a7a
color8  = #7f8792
