# Hinode: a retro JAPAN badge on vermilion — washi cream card, sun red, sumi black.
# Logo centred on its flat red background for the ultrawide.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=80 accent=30 border=30 syntax=30,250,145,330,70 accent_c=.13  (colours computed by ./design)
name            = Hinode
mode            = light
emacs_theme     = doom-hinode
cursor          = Hinode
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/hinode-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/hinode-3440.png

bg        = #f6f3ed
bg_alt    = #efeae2
bg_hl     = #e8e2d8
sel       = #e7cdc9
dim       = #b6b0a7
mid       = #726756
fg        = #302a21
bright    = #1d170e
accent    = #a04034
accent_fg = #fbf5f4
bar       = #a8372a
bar_fg    = #fbf5f4
border    = #bd4334

comment   = #8c8579
string    = #446c45
number    = #7c592e
keyword   = #865047
function  = #3e6389
type      = #795075
punct     = #6b6254
err       = #9c4343
warn      = #7c592e
ok        = #3c6c53

color0  = #1d170e
color1  = #a83630
color2  = #027827
