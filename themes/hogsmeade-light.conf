# Hogsmeade, light: same hues as hogsmeade.conf, light ground. Same wallpaper.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=250 accent=250 border=65 syntax=25,245,160,300,70  (colours computed by ./design)
