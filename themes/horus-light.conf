# Horus Wings, light: papyrus cream, slate ink, terracotta highlight, ochre border. Same wallpaper as horus.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=75 accent=29 border=65 syntax=29,250,130,330,60  (colours computed by ./design)
