# Howl, light: the scroll's parchment, umber ink, chili-red accent, mandrake-leaf border.
# Same wallpaper as howl.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=88 accent=30 border=135 syntax=25,225,135,320,70  (colours computed by ./design)
base            = howl
name            = Howl Light
mode            = light
emacs_theme     = doom-howl-light
cursor          = HowlCastleLight

bg        = #f6f3ed
bg_alt    = #eeebe2
bg_hl     = #e7e3d8
sel       = #e7cdc9
dim       = #b5b1a7
mid       = #706855
fg        = #2f2b20
bright    = #1c180e
accent    = #84554d
accent_fg = #fbf5f4
bar       = #a8372a
bar_fg    = #fbf5f4
border    = #448502

comment   = #8b8679
string    = #4e6a3e
number    = #7c592e
keyword   = #864f4b
function  = #286980
type      = #73527b
punct     = #696354
err       = #9c4343
warn      = #7c592e
ok        = #3c6c53

color0  = #1c180e
color1  = #a83637
color2  = #2b7611
color3  = #8a5700
color4  = #006d98
color5  = #874197
color6  = #007089
color7  = #706855
color8  = #8b8679
color9  = #bb5754
color10 = #4e8c3d
color11 = #a86c00
color12 = #0086b9
color13 = #9c5eaa
color14 = #008aa7
color15 = #2f2b20
