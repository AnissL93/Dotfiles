# Howl, light: the scroll's parchment, umber ink, chili-red accent, mandrake-leaf border.
# Same wallpaper as howl.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=oil base=88 accent=30 border=135 syntax=25,225,135,320,70  (colours computed by ./design)
base            = howl
name            = Howl Light
mode            = light
emacs_theme     = doom-howl-light
cursor          = HowlCastleLight

bg        = #f7f3e9
bg_alt    = #f1ebdc
bg_hl     = #eae2d1
sel       = #f1cac3
dim       = #b7b1a0
mid       = #756847
fg        = #322a18
bright    = #1e1706
accent    = #742f25
accent_fg = #fbf5f4
bar       = #861309
bar_fg    = #fbf5f4
soft      = 0.85
border    = #448502

comment   = #8e8571
string    = #3c6124
