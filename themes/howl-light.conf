keyword   = #843c38
function  = #00607f
type      = #6d4177
punct     = #6d6249
err       = #9c4343
warn      = #784900
ok        = #1a6444

color0  = #1e1706
color1  = #a83637
color2  = #2b7611
color3  = #8a5700
