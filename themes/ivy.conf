# Ivy: a Ghibli brick manor under ivy — sunlit sage and leaf green, pool teal, brick red,
# rose-pink flowers, slate roof. ivy-dark.conf is the same house at dusk.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=140 accent=175 border=30 syntax=30,195,140,0,70  (colours computed by ./design)
name            = Ivy Manor
mode            = light
emacs_theme     = doom-ivy
cursor          = IvyManor
wallpaper_2560  = ivy-2560.png
wallpaper_3440  = ivy-3440.png

bg        = #f1f5f0
