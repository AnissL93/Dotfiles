# Jellyfish Pool. Drained school pool under a summer sky, jellyfish and dolphins drifting overhead:
# cloud-white and pool blue, pink walls and hose.
# Light; jelly-dark.conf is the dark version.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=watercolor base=235 accent=250 border=350 syntax=355,250,190,290,60  (colours computed by ./design)
name            = Jellyfish Pool
mode            = light
emacs_theme     = doom-jelly
cursor          = JellyfishPool
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/jelly-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/jelly-3440.png

bg        = #eaf5fd
bg_alt    = #deeef8
bg_hl     = #d3e6f2
sel       = #bad8f8
dim       = #a2b4c0
mid       = #496e84
fg        = #192e3a
bright    = #061b26
accent    = #97c9fd
accent_fg = #111921
bar       = #8fc9ff
bar_fg    = #111921
soft      = 1
border    = #b2417f

comment   = #728a99
string    = #007570
number    = #8c541f
keyword   = #8f4966
function  = #32669a
type      = #635898
punct     = #4a6879
err       = #9c4343
warn      = #8c541f
ok        = #2b7351

color0  = #061b26
color1  = #a4345c
color2  = #007563
color3  = #925100
color4  = #0066b3
color5  = #704aab
color6  = #007472
color7  = #496e84
color8  = #728a99
color9  = #b75573
color10 = #00907a
color11 = #ad6800
color12 = #307fc3
color13 = #8667bc
color14 = #008e8c
color15 = #192e3a
