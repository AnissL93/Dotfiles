# Jellyfish Pool. Drained school pool under a summer sky, jellyfish and dolphins drifting overhead:
# cloud-white and pool blue, pink walls and hose.
# Light; jelly-dark.conf is the dark version.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=235 accent=250 border=350 syntax=355,250,190,290,60  (colours computed by ./design)
name            = Jellyfish Pool
mode            = light
emacs_theme     = doom-jelly
cursor          = JellyfishPool
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/jelly-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/jelly-3440.png

bg        = #eef4f8
bg_alt    = #e4edf2
bg_hl     = #dae5eb
sel       = #c6d6e8
dim       = #a9b3b9
mid       = #596c78
fg        = #222d34
bright    = #101a20
accent    = #466687
accent_fg = #f4f7fb
bar       = #0065b4
bar_fg    = #f4f7fb
border    = #b2417f

comment   = #7c8890
string    = #1e6e6a
number    = #805632
keyword   = #824e63
function  = #3e6389
type      = #605988
punct     = #56666f
err       = #9c4343
warn      = #805632
ok        = #3c6c53

color0  = #101a20
color1  = #a4345c
color2  = #007563
color3  = #925100
color4  = #0066b3
color5  = #704aab
color6  = #007472
color7  = #596c78
color8  = #7c8890
color9  = #b75573
color10 = #00907a
color11 = #ad6800
color12 = #307fc3
color13 = #8667bc
color14 = #008e8c
color15 = #222d34
