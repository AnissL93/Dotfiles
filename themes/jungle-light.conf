# Night Jungle, light: same hues as jungle.conf, light ground. Same wallpaper.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=275 accent=195 border=300 syntax=305,200,125,160,355  (colours computed by ./design)
