# Kaguya: watercolour valley (Tale of the Princess Kaguya) — washi paper, sumi ink lines,
# spring greens, wisteria mountains, peach blossom pink, carriage lime, earth ochre. Light.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=95 accent=140 border=320 syntax=15,260,140,320,70  (colours computed by ./design)
name            = Kaguya
mode            = light
emacs_theme     = doom-kaguya
cursor          = Kaguya
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/kaguya-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/kaguya-3440.png

bg        = #f5f3ed
bg_alt    = #edebe2
bg_hl     = #e6e3d8
