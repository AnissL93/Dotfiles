# Lo-fi Kitchen, light: same hues as kitchen.conf, light ground. Same wallpaper.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=20 accent=45 border=190 syntax=25,190,95,250,65  (colours computed by ./design)
base            = kitchen
name            = Lo-fi Kitchen Light
mode            = light
emacs_theme     = doom-kitchen-light
cursor          = LofiKitchenLight

bg        = #f9f1f1
