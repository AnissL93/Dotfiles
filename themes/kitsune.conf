# Kitsune Masks. Flower-crowned girl in an indigo circle of oni and fox masks on mint-cyan.
# Light; kitsune-dark.conf is the dark version.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=190 accent=285 border=330 syntax=340,265,170,310,35  (colours computed by ./design)
name            = Kitsune Masks
mode            = light
emacs_theme     = doom-kitsune
cursor          = KitsuneMasks
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/kitsune-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/kitsune-3440.png

bg        = #edf5f5
bg_alt    = #e3eeed
bg_hl     = #d9e6e5
sel       = #d2d2e8
dim       = #a7b4b3
mid       = #556f6d
fg        = #202f2d
bright    = #0e1b1a
accent    = #5f5e87
accent_fg = #f6f6fb
bar       = #5d52b4
bar_fg    = #f6f6fb
border    = #a3489d

comment   = #7a8a89
string    = #2c6e5a
number    = #855043
keyword   = #7d4f6e
function  = #4b5f8b
type      = #6d5480
punct     = #546866
err       = #9c4343
warn      = #855043
ok        = #3c6c53

color0  = #0e1b1a
