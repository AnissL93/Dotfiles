# Kitsune Masks. Flower-crowned girl in an indigo circle of oni and fox masks on mint-cyan.
# Light; kitsune-dark.conf is the dark version.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=watercolor base=190 accent=285 border=330 syntax=340,265,170,310,35  (colours computed by ./design)
name            = Kitsune Masks
mode            = light
emacs_theme     = doom-kitsune
cursor          = KitsuneMasks
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/kitsune-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/kitsune-3440.png

bg        = #e8f7f6
bg_alt    = #dbf0ee
bg_hl     = #d0e9e7
sel       = #d0d0f8
dim       = #9fb7b5
mid       = #417370
fg        = #14312f
bright    = #011d1c
accent    = #bdbcfd
accent_fg = #171721
bar       = #bdbbff
bar_fg    = #171721
soft      = 1
border    = #a3489d

comment   = #6e8d8b
