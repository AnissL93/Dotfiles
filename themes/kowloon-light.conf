# Kowloon, light: overcast paper grey, neon red accent, mint border. Same wallpaper as kowloon.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=262 accent=15 border=190 syntax=15,250,170,320,60  (colours computed by ./design)
base            = kowloon
name            = Kowloon Light
mode            = light
emacs_theme     = doom-kowloon-light
cursor          = KowloonLight

bg        = #f0f4f9
bg_alt    = #e7ebf3
bg_hl     = #dee3ed
sel       = #e7cdce
dim       = #acb1bb
mid       = #60697b
fg        = #262c35
bright    = #131821
accent    = #845457
accent_fg = #fbf5f5
bar       = #a73447
bar_fg    = #fbf5f5
border    = #00847f

comment   = #808692
string    = #2c6e5a
number    = #805632
keyword   = #864e53
function  = #3e6389
type      = #73527b
punct     = #5c6471
err       = #9c4343
warn      = #805632
ok        = #3c6c53

color0  = #131821
color1  = #a73444
color2  = #007850
color3  = #925100
color4  = #0066b3
color5  = #874197
color6  = #007472
color7  = #60697b
color8  = #808692
color9  = #ba565f
color10 = #009265
color11 = #ad6800
color12 = #307fc3
color13 = #9c5eaa
color14 = #008e8c
color15 = #262c35
