# Kowloon: rain-wet neon street — slate-indigo night, red neon reflected on asphalt,
# one mint sign. kowloon-light.conf is the same street by grey daylight.
# design: dark base=262 accent=15 border=175 syntax=15,250,175,320,65 accent_c=.10  (colours computed by ./design)
