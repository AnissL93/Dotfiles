# Lagoon, light: moon-pale sand and foam, deep-sea ink, aqua accent, palm border. Same wallpaper as lagoon.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=230 accent=230 border=150 syntax=20,240,150,290,70  (colours computed by ./design)
base            = lagoon
name            = Lagoon Light
mode            = light
emacs_theme     = doom-lagoon-light
cursor          = LagoonLight

bg        = #eef5f8
bg_alt    = #e3edf2
bg_hl     = #dae5eb
sel       = #c1d8e4
dim       = #a8b3b9
mid       = #586d77
fg        = #222d33
bright    = #0f1a1f
accent    = #396a81
accent_fg = #f3f8fa
bar       = #006e98
bar_fg    = #f3f8fa
border    = #008a39

comment   = #7b8990
