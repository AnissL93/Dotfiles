# Lamplight, light: grey-blue morning mist, cyan glow as accent, traffic-light rose border. Same wallpaper as lamplight.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=255 accent=220 border=15 syntax=15,240,185,300,65  (colours computed by ./design)
base            = lamplight
name            = Lamplight Light
mode            = light
emacs_theme     = doom-lamplight-light
cursor          = LamplightLight

bg        = #f0f4f9
bg_alt    = #e6ecf3
bg_hl     = #dde4ed
sel       = #c0d9e2
dim       = #abb2ba
mid       = #5e6a7a
fg        = #252c35
bright    = #121921
accent    = #336c7d
accent_fg = #f3f8fa
bar       = #00708a
bar_fg    = #f3f8fa
border    = #bc3f53

comment   = #7f8792
string    = #206e66
number    = #7e5730
keyword   = #864e53
function  = #356687
type      = #675685
punct     = #5a6471
err       = #9c4343
warn      = #7e5730
ok        = #3c6c53

color0  = #121921
color1  = #a73444
color2  = #00765f
color3  = #8e5400
color4  = #0069ab
color5  = #7947a5
color6  = #00746f
color7  = #5e6a7a
color8  = #7f8792
color9  = #ba565f
color10 = #009176
color11 = #ab6a00
color12 = #1682c0
color13 = #8e64b7
color14 = #008e88
color15 = #252c35
