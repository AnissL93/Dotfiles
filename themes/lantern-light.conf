# Lantern, light: snowy paper white, sepia ink, lamplight gold-brown highlight.
# Same wallpaper as lantern.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=80 accent=70 border=60 syntax=40,230,110,310,75  (colours computed by ./design)
