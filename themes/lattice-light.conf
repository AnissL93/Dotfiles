# Lattice, light: the white-gold centre tunnel — ivory paper, crimson accent, spiral-eye blue border. Same wallpaper as lattice.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=50 accent=25 border=265 syntax=25,265,140,300,60  (colours computed by ./design)
