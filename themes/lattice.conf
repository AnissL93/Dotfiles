# Lattice: Alex Grey's Net of Being — blood-red faces, gold halos, blue spiral eyes. Repeating pattern: wallpaper cropped, not padded. lattice-light.conf is the light version.
# design: dark base=25 accent=30 border=265 syntax=25,265,95,300,60  (colours computed by ./design)
