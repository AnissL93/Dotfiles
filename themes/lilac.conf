# Lilac room: guitar-girl bedroom regraded to lavender vapor — lilac paper, ink violet,
# vapor pink and cyan, fairy-light gold. Light; lilac-dark.conf is the dark version.
# The wallpaper is the original blended 70% into a violet→lilac duotone.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=300 accent=295 border=350 syntax=350,275,195,315,70  (colours computed by ./design)
