# Lilac room: guitar-girl bedroom regraded to lavender vapor — lilac paper, ink violet,
# vapor pink and cyan, fairy-light gold. Light; lilac-dark.conf is the dark version.
# The wallpaper is the original blended 70% into a violet→lilac duotone.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=300 accent=295 border=350 syntax=350,275,195,315,70  (colours computed by ./design)
name            = Lilac Room
mode            = light
emacs_theme     = doom-lilac
cursor          = LilacRoom
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/lilac-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/lilac-3440.png

bg        = #f4f2f8
bg_alt    = #ece9f2
bg_hl     = #e4e1eb
sel       = #d5d1e6
dim       = #b2afb9
mid       = #6b6578
fg        = #2d2934
bright    = #1a1620
accent    = #665c85
accent_fg = #f7f6fa
border    = #987484

comment   = #888490
string    = #1c6e6e
number    = #7c592e
keyword   = #814e66
function  = #545d8b
type      = #71537e
punct     = #65606f
err       = #9c4343
warn      = #7c592e
ok        = #3c6c53

color0  = #1a1620
color1  = #895151
color2  = #426f4c
color3  = #7a5e2e
color4  = #3c688b
color5  = #76557e
color6  = #1f7074
color7  = #6b6578
color8  = #888490
color9  = #a06a69
color10 = #5c8664
color11 = #907649
color12 = #567fa1
color13 = #8d6d94
color14 = #42878b
color15 = #2d2934
