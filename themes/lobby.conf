# Lobby: an isometric pixel-art Pokemon Center in sepia on near-black. Dark: charcoal base,
# sepia-tan accent, bottle-green border, lavender trees. lobby-light.conf is the light one.
# Wallpaper: the art downsampled to its native pixels (4px) and scaled x3, centred on #1e1e1d.
# design: dark base=90 base_c=.008 accent=70 border=130 syntax=30,300,130,340,70  (colours computed by ./design)
name            = Lobby
mode            = dark
emacs_theme     = doom-lobby
cursor          = Lobby
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/lobby-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/lobby-3440.png

bg        = #211f1b
