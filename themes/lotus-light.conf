# Lotus pond, light: pale pond-mist paper, deep green ink, violet lily highlight.
# Same wallpaper as lotus.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=150 accent=290 border=165 syntax=330,245,135,290,75  (colours computed by ./design)
base            = lotus
name            = Lotus Pond Light
mode            = light
emacs_theme     = doom-lotus-light
cursor          = LotusPondLight

bg        = #f0f5f0
bg_alt    = #e6eee7
bg_hl     = #dde6de
sel       = #d3d1e7
dim       = #abb4ac
mid       = #5d6e60
fg        = #252e26
bright    = #121b14
accent    = #625d86
accent_fg = #f6f6fb
bar       = #644fb1
bar_fg    = #f6f6fb
border    = #00885f

comment   = #7e8a80
string    = #4e6a3e
number    = #795a2c
keyword   = #795075
function  = #396588
type      = #605988
punct     = #5a675c
err       = #9c4343
warn      = #795a2c
ok        = #3c6c53

color0    = #121b14
color1    = #a8353e
color2    = #2b7611
color3    = #885800
color4    = #0068b2
color5    = #8e3e8f
color6    = #007660
color7    = #5d6e60
color8    = #7e8a80
color9    = #bb565a
color10   = #4e8c3d
color11   = #a56e00
color12   = #2580c1
color13   = #a25ca2
color14   = #009177
color15   = #252e26
