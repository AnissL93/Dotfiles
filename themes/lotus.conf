# Lotus pond: dark green-black water, lily pads, violet water lilies with gold hearts.
# Dark; lotus-light.conf is the light version. 3440 crops the 3:2 photo around the flowers.
# design: dark base=165 accent=290 border=135 syntax=330,245,135,290,75  (colours computed by ./design)
name            = Lotus Pond
mode            = dark
emacs_theme     = doom-lotus
cursor          = LotusPond
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/lotus-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/lotus-3440.png

bg        = #12241c
