# Lowrider Lot, light. Same wallpaper as lowrider.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=220 accent=210 border=330 syntax=345,250,180,300,55  (colours computed by ./design)
base            = lowrider
name            = Lowrider Lot Light
mode            = light
emacs_theme     = doom-lowrider-light
cursor          = LowriderLotLight

bg        = #eef5f7
bg_alt    = #e3edf1
bg_hl     = #d9e5ea
sel       = #bfdadf
dim       = #a8b3b7
mid       = #566d75
fg        = #212e32
bright    = #0e1a1e
accent    = #306d78
accent_fg = #f2f8f9
bar       = #007181
bar_fg    = #f2f8f9
border    = #a3489d

comment   = #7a898e
string    = #246e62
number    = #815535
keyword   = #7f4f6a
function  = #3e6389
type      = #675685
punct     = #55676d
err       = #9c4343
warn      = #815535
ok        = #3c6c53

color0  = #0e1a1e
color1  = #a13567
color2  = #00775b
color3  = #954e00
color4  = #0066b3
color5  = #8e3e8f
color6  = #00727f
color7  = #566d75
color8  = #7a898e
color9  = #b4567d
color10 = #009170
color11 = #af660a
color12 = #307fc3
color13 = #a25ca2
color14 = #008c9b
color15 = #212e32
