# Mandel, light: cream bg, steel-blue accent, flame border. Same wallpaper as mandel.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=90 accent=235 border=35 syntax=25,240,95,300,60  (colours computed by ./design)
base            = mandel
name            = Mandel Light
mode            = light
emacs_theme     = doom-mandel-light
cursor          = MandelLight

bg        = #f6f3ed
bg_alt    = #eeebe2
bg_hl     = #e6e3d8
sel       = #c2d8e5
dim       = #b4b1a7
mid       = #706855
fg        = #2f2b20
bright    = #1c180e
accent    = #3c6983
accent_fg = #f3f7fa
bar       = #006c9d
bar_fg    = #f3f7fa
border    = #bc4527

comment   = #8b8679
string    = #6e602a
number    = #805632
keyword   = #864f4b
function  = #356687
type      = #675685
punct     = #686354
err       = #9c4343
warn      = #805632
ok        = #3c6c53

color0  = #1c180e
color1  = #a83637
color2  = #00792f
color3  = #7b5f00
color4  = #0069ab
color5  = #7947a5
color6  = #006f90
color7  = #706855
color8  = #8b8679
color9  = #bb5754
color10 = #348f4f
color11 = #967600
color12 = #1682c0
color13 = #8e64b7
color14 = #0088af
color15 = #2f2b20
