# Mandel, light: cream bg, steel-blue accent, flame border. Same wallpaper as mandel.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=oil base=90 accent=235 border=35 syntax=25,240,95,300,60  (colours computed by ./design)
base            = mandel
name            = Mandel Light
mode            = light
emacs_theme     = doom-mandel-light
cursor          = MandelLight

bg        = #f7f3e9
bg_alt    = #f0ebdc
bg_hl     = #e9e3d1
sel       = #b9daee
dim       = #b7b1a0
mid       = #746847
fg        = #312b18
bright    = #1e1806
accent    = #004e75
accent_fg = #f3f7fa
bar       = #004e75
bar_fg    = #f3f7fa
soft      = 0.85
border    = #bc4527

comment   = #8e8671
string    = #675400
number    = #7d460b
keyword   = #843c38
function  = #085b87
type      = #5e4784
punct     = #6c6349
err       = #9c4343
warn      = #7d460b
ok        = #1a6444

color0  = #1e1806
color1  = #a83637
color2  = #00792f
color3  = #7b5f00
color4  = #0069ab
color5  = #7947a5
color6  = #006f90
