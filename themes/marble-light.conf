# Marble Swirl, light: white paint ground, petrol-teal ink and highlight, coral border. Same wallpaper as marble.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=220 accent=232 border=20 syntax=20,232,170,300,60  (colours computed by ./design)
