# Medusa, light: pale sea-glass paper, deep jade accent, tent-orange border. Same wallpaper as medusa.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=185 accent=175 border=40 syntax=35,230,160,290,70  (colours computed by ./design)
