# Mesa: a hiker and a corgi walking to a hut on a grassy stone mesa among clouds.
# Light: cloud-white with a sage tint, sky-blue accent, grass-green border. mesa-dark.conf is the dark one.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=150 accent=215 border=140 syntax=30,215,140,300,70  (colours computed by ./design)
name            = Mesa
mode            = light
emacs_theme     = doom-mesa
cursor          = Mesa
wallpaper_2560  = mesa-2560.png
wallpaper_3440  = mesa-3440.png

