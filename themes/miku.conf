# Miku crowd: chibi Snow Miku sea. Designed in OKLCH (see ./oklch), not sampled: snow-tinted
# base (hue 235, chroma ~0.01), muted steel-blue accent, teal border; syntax shares one lightness
# and chroma 0.075 at hues rose 12 / blue 245 / teal 190 / lavender 295 / sand 70.
# Light; miku-dark.conf is the dark version.
# The wallpaper crops the portrait source (border shaved) to a band of the crowd.
# color7/color15 ("white") are dark: prompts print text in bold white.
name            = Miku Crowd
mode            = light
emacs_theme     = doom-miku
cursor          = MikuCrowd
wallpaper_2560  = miku-2560.png
wallpaper_3440  = miku-3440.png

bg        = #eff4f8
bg_alt    = #e4edf2
bg_hl     = #dae5eb
sel       = #c0d9e2
dim       = #a8b3b9
mid       = #5a6c79
fg        = #242c35
bright    = #111921
accent    = #3e6984
accent_fg = #f3f7fa
border    = #62908f
# dwm bar only (selected tag + title): lighter ice blue with ink text
bar       = #8db9cd
bar_fg    = #182029

comment   = #7c8891
string    = #1e6e6a
number    = #7c592e
keyword   = #854e55
function  = #396588
type      = #635887
punct     = #576570
err       = #9c4343
warn      = #7c592e
ok        = #366d56

color0  = #111921
color1  = #895151
color2  = #426f4c
color3  = #7a5e2e
color4  = #3c688b
color5  = #76557e
color6  = #1f7074
color7  = #5a6c79
color8  = #7c8891
color9  = #a06a69
color10 = #5c8664
color11 = #907649
color12 = #567fa1
color13 = #8d6d94
color14 = #42878b
color15 = #242c35
