# Neon Canal, light. Same wallpaper as neon.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=300 accent=340 border=210 syntax=350,250,180,310,50  (colours computed by ./design)
base            = neon
name            = Neon Canal Light
mode            = light
emacs_theme     = doom-neon-light
cursor          = NeonCanalLight

bg        = #f4f2f8
bg_alt    = #ece9f2
bg_hl     = #e4e1eb
sel       = #e3cdda
dim       = #b2afb9
mid       = #6b6578
fg        = #2d2934
bright    = #1a1620
accent    = #7c556f
accent_fg = #faf5f8
bar       = #98397e
bar_fg    = #faf5f8
border    = #008193

comment   = #888490
string    = #246e62
number    = #835338
keyword   = #814e66
function  = #3e6389
type      = #6d5480
punct     = #65606f
err       = #9c4343
warn      = #835338
ok        = #3c6c53

color0  = #1a1620
color1  = #a23461
color2  = #00775b
color3  = #994b00
color4  = #0066b3
color5  = #80449f
color6  = #00727f
color7  = #6b6578
color8  = #888490
color9  = #b65579
color10 = #009170
color11 = #b16415
color12 = #307fc3
color13 = #9561b1
color14 = #008c9b
color15 = #2d2934
