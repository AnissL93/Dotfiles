# Neon Canal. Neon town over black water: indigo night, hot-pink windows, cyan signs.
# Dark; neon-light.conf is the light version.
# design: dark base=285 accent=350 border=210 syntax=350,215,180,310,50 accent_c=.11 base_c=.035  (colours computed by ./design)
