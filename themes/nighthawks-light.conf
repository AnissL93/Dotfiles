# Nighthawks, light: same hues as nighthawks.conf, light ground. Same wallpaper.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=195 accent=105 border=155 syntax=30,105,155,225,65  (colours computed by ./design)
base            = nighthawks
name            = Nighthawks Light
mode            = light
emacs_theme     = doom-nighthawks-light
cursor          = NighthawksLight

bg        = #edf5f5
bg_alt    = #e3eeee
bg_hl     = #d9e6e6
sel       = #d7d6bf
dim       = #a7b4b4
