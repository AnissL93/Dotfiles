# Onett, light: cream road bg, teal accent, brick border. Same wallpaper as onett.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=95 accent=200 border=25 syntax=25,225,145,330,65  (colours computed by ./design)
base            = onett
name            = Onett Light
mode            = light
emacs_theme     = doom-onett-light
cursor          = OnettLight

bg        = #f5f3ed
bg_alt    = #edebe2
bg_hl     = #e6e3d8
sel       = #bedbdc
dim       = #b4b1a7
mid       = #6e6956
fg        = #2e2b21
bright    = #1b180e
accent    = #2e6e72
accent_fg = #f2f8f8
bar       = #007378
bar_fg    = #f2f8f8
border    = #bd413f

comment   = #8a8679
string    = #446c45
number    = #7e5730
keyword   = #864f4b
function  = #286980
type      = #795075
punct     = #676354
err       = #9c4343
warn      = #7e5730
ok        = #3c6c53

color0  = #1b180e
color1  = #a83637
color2  = #027827
color3  = #8e5400
color4  = #006d98
color5  = #8e3e8f
color6  = #007378
color7  = #6e6956
