# Ossuary, light: bone paper, midnight-blue ink, coral-bone highlight.
# Same wallpaper as ossuary.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=240 accent=40 border=245 syntax=40,240,190,290,75  (colours computed by ./design)
base            = ossuary
name            = Ossuary Light
mode            = light
emacs_theme     = doom-ossuary-light
cursor          = OssuaryLight

bg        = #eff4f9
bg_alt    = #e4ecf3
bg_hl     = #dbe4ec
sel       = #e7cec6
dim       = #a9b3b9
mid       = #5a6c79
fg        = #232d34
bright    = #101a20
accent    = #835647
accent_fg = #fbf5f4
bar       = #a63c0c
bar_fg    = #fbf5f4
border    = #0077c7

comment   = #7c8891
string    = #1e6e6a
number    = #795a2c
keyword   = #85513f
function  = #356687
type      = #605988
punct     = #576570
err       = #9c4343
warn      = #795a2c
ok        = #3c6c53

color0    = #101a20
color1    = #a73920
color2    = #007563
color3    = #885800
color4    = #0068b2
color5    = #704aab
color6    = #007472
color7    = #5a6c79
color8    = #7c8891
color9    = #ba5a44
color10   = #00907a
color11   = #a56e00
color12   = #2580c1
color13   = #8667bc
color14   = #008e8c
color15   = #232d34
