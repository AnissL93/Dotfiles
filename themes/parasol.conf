# Parasol Robot. Girl under an orange parasol on a white robot, flat mint-green ground; yellow cap, red pots.
# Light; parasol-dark.conf is the dark version.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=150 accent=155 border=40 syntax=25,235,145,330,85 base_c=.02  (colours computed by ./design)
name            = Parasol Robot
mode            = light
emacs_theme     = doom-parasol
cursor          = ParasolRobot
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/parasol-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/parasol-3440.png

bg        = #edf6ef
bg_alt    = #e2efe4
bg_hl     = #d8e8db
sel       = #c6dacc
dim       = #a7b6a9
mid       = #54715a
fg        = #203023
bright    = #0d1c10
accent    = #446e53
accent_fg = #f4f8f5
bar       = #00793d
bar_fg    = #f4f8f5
border    = #bb4717

comment   = #798c7c
string    = #446c45
number    = #745d2a
keyword   = #864f4b
function  = #306785
type      = #795075
punct     = #536a57
err       = #9c4343
warn      = #745d2a
ok        = #3c6c53

color0  = #0d1c10
color1  = #a83637
color2  = #027827
color3  = #815c00
color4  = #006ba4
color5  = #8e3e8f
color6  = #006f90
color7  = #54715a
color8  = #798c7c
color9  = #bb5754
color10 = #3e8e49
color11 = #9f7200
color12 = #0083be
color13 = #a25ca2
color14 = #0088af
color15 = #203023
