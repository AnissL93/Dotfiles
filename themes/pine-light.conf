# Pine, light: hazy sky paper, sea-navy accent, needle-green border.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=220 accent=245 border=135 syntax=255,140,110,200,50  (colours computed by ./design)
base            = pine
name            = Pine Light
mode            = light
emacs_theme     = doom-pine-light
cursor          = PineLight

bg        = #eef5f7
bg_alt    = #e3edf1
bg_hl     = #d9e5ea
sel       = #c5d7e7
dim       = #a8b3b7
mid       = #566d75
fg        = #212e32
bright    = #0e1a1e
accent    = #426786
accent_fg = #f4f7fb
bar       = #0068b2
bar_fg    = #f4f7fb
border    = #448502

comment   = #7a898e
string    = #63642f
