# Pine: windswept pine over a navy sea at dusk — blue-black base, needle-green accent,
# sea-blue border, warm bark as the complement. Dark; pine-light.conf is the noon version.
# 3440 crops the sky above/below (no padding).
# design: dark base=240 accent=135 border=245 syntax=250,135,110,200,55  (colours computed by ./design)
