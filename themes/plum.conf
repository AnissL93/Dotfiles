# Plum blossom: watercolour teal paper, ink-black branch, coral blossoms (謹賀新年 wallpaper, pixelated).
# Light theme: ink text on pale teal, coral for selection/accent.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=watercolor base=195 accent=30 border=25 syntax=25,250,180,310,70  (colours computed by ./design)
name            = Plum Blossom
mode            = light
emacs_theme     = doom-plum
cursor          = PlumBlossom
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/plum-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/plum-3440.png

bg        = #e8f7f7
