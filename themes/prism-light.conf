# Prism, light: lilac haze paper, plum ink, magenta highlight, teal glint border.
# Same wallpaper as prism.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=320 accent=345 accent_c=.1 border=200 syntax=350,285,185,320,60  (colours computed by ./design)
base            = prism
name            = Prism Light
mode            = light
emacs_theme     = doom-prism-light
cursor          = PrismLight

bg        = #f6f2f7
bg_alt    = #efe9f0
bg_hl     = #e7e0e9
sel       = #e4cdd9
dim       = #b5aeb7
mid       = #716474
fg        = #302831
bright    = #1c151e
accent    = #8b4a70
accent_fg = #faf5f8
bar       = #9b3876
bar_fg    = #faf5f8
border    = #008388

comment   = #8b838d
string    = #206e66
number    = #805632
keyword   = #814e66
function  = #5c5a89
type      = #73527b
punct     = #6a5f6c
err       = #9c4343
warn      = #805632
ok        = #3c6c53

color0    = #1c151e
color1    = #a23461
color2    = #00765f
color3    = #925100
color4    = #4958b7
color5    = #874197
color6    = #007378
color7    = #716474
color8    = #8b838d
color9    = #b65579
color10   = #009176
color11   = #ad6800
color12   = #6273c7
color13   = #9c5eaa
color14   = #008c93
color15   = #302831
