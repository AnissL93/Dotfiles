# Prism: low-poly synthwave desert, inverted magenta pyramid, indigo night, one teal glint.
# Dark; prism-light.conf is the light version. 3440 crops the bottom (empty dunes).
# design: dark base=300 base_c=.04 accent=350 accent_c=.12 border=185 syntax=350,285,185,320,60  (colours computed by ./design)
name            = Prism
mode            = dark
emacs_theme     = doom-prism
cursor          = Prism
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/prism-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/prism-3440.png

bg        = #221b2f
