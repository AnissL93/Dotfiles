# Rainbow: retro six-colour apple badge on cream — black ink, red/orange/yellow/green/purple/blue bands.
# Light; rainbow-dark.conf is the dark version. Wallpaper: the logo centred on its cream (flat) background.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=95 accent=25 border=245 syntax=25,245,140,320,65  (colours computed by ./design)
name            = Rainbow
mode            = light
emacs_theme     = doom-rainbow
cursor          = Rainbow
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/rainbow-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/rainbow-3440.png

bg        = #f5f3ed
bg_alt    = #edebe2
bg_hl     = #e6e3d8
sel       = #e8cdca
dim       = #b4b1a7
mid       = #6e6956
fg        = #2e2b21
bright    = #1b180e
accent    = #855450
accent_fg = #fbf5f5
bar       = #a83634
bar_fg    = #fbf5f5
border    = #0077c7

comment   = #8a8679
string    = #496b42
