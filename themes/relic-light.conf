keyword   = #85513f
function  = #3e6389
type      = #675685
punct     = #6b6254
err       = #9c4343
warn      = #7e5730
ok        = #3c6c53

color0  = #1d170e
color1  = #a73920
color2  = #3e7400
color3  = #8e5400
color4  = #0066b3
color5  = #7947a5
