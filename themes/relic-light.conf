# Relic Desk, light: beige-plastic cream, olive ink, tape-green highlight, lavender border. Same wallpaper as relic.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=80 accent=126 border=300 syntax=40,250,126,300,65  (colours computed by ./design)
base            = relic
name            = Relic Desk Light
mode            = light
emacs_theme     = doom-relic-light
cursor          = RelicDeskLight

bg        = #f6f3ed
bg_alt    = #efeae2
bg_hl     = #e8e2d8
sel       = #cfd8c3
dim       = #b6b0a7
mid       = #726756
fg        = #302a21
bright    = #1d170e
accent    = #5a6a41
accent_fg = #f6f7f3
bar       = #507000
bar_fg    = #f6f7f3
border    = #8156c0

comment   = #8c8579
string    = #566838
