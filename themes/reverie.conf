# Reverie: anatomical dreamer under a golden sun mandala — cream light, lilac haze, rose blossoms, one red flask. reverie-dark.conf is the violet dusk version.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=oil base=80 accent=305 border=20 syntax=15,280,130,320,60  (colours computed by ./design)
name            = Reverie
mode            = light
emacs_theme     = doom-reverie
cursor          = Reverie
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/reverie-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/reverie-3440.png

bg        = #f8f3e9
