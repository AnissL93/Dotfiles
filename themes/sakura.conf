# Sakura: cherry blossoms against a bright sky — petal pink, white light, bark brown,
# olive young leaves. sakura-dark.conf is the tree at dusk.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=watercolor base=10 accent=10 border=50 syntax=10,250,120,330,55  (colours computed by ./design)
name            = Sakura
mode            = light
emacs_theme     = doom-sakura
cursor          = Sakura
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/sakura-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/sakura-3440.png

bg        = #feeff1
