# Sakura: cherry blossoms against a bright sky — petal pink, white light, bark brown,
# olive young leaves. sakura-dark.conf is the tree at dusk.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=10 accent=10 border=50 syntax=10,250,120,330,55  (colours computed by ./design)
name            = Sakura
mode            = light
emacs_theme     = doom-sakura
cursor          = Sakura
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/sakura-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/sakura-3440.png

bg        = #f9f1f2
bg_alt    = #f3e8e9
bg_hl     = #ecdfe1
sel       = #e7cdd0
dim       = #baadaf
mid       = #796265
fg        = #342729
bright    = #201516
accent    = #84545b
accent_fg = #fbf5f6
bar       = #a6344f
bar_fg    = #fbf5f6
border    = #b74d00

comment   = #918283
string    = #5b6734
number    = #815535
keyword   = #854e57
function  = #3e6389
type      = #795075
punct     = #705e60
err       = #9c4343
warn      = #815535
ok        = #3c6c53

color0  = #201516
