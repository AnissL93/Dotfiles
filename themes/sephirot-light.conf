keyword   = #865047
function  = #745d2a
type      = #43628a
punct     = #6e614c
err       = #9c4343
warn      = #805632
ok        = #3c6c53

color0  = #1f1708
color1  = #a83630
color2  = #00784a
color3  = #815c00
color4  = #0064b5
color5  = #874197
color6  = #007660
