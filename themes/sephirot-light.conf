# Sephirot, light: same hues as sephirot.conf, light ground. Same wallpaper.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=80 base_c=.018 accent=85 border=30 syntax=30,85,165,255,60  (colours computed by ./design)
base            = sephirot
name            = Sephirot Light
mode            = light
emacs_theme     = doom-sephirot-light
cursor          = SephirotLight

bg        = #f8f3ea
bg_alt    = #f2eade
bg_hl     = #ebe2d3
sel       = #ddd3bf
dim       = #b8b0a2
mid       = #77664b
fg        = #332a1b
bright    = #1f1708
accent    = #746036
accent_fg = #f9f6f2
bar       = #805d00
bar_fg    = #f9f6f2
border    = #bd4334

comment   = #8f8573
string    = #316e56
