# Sephirot: Kircher's Tree of Life (Systema Sephiroticum). The source is pure black/white, so the
# wallpaper is recoloured parchment-on-ink (+level-colors '#15130f','#e6d8b4', padded, uncropped)
# and the palette is designed from manuscript pigments: warm ink base, gold-leaf highlight,
# rubric-red border; syntax rubric red, gold, verdigris, lapis, ochre.
# design: dark base=80 base_c=.018 accent=85 border=30 syntax=30,85,165,255,60  (colours computed by ./design)
name            = Sephirot
emacs_theme     = doom-sephirot
cursor          = Sephirot
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/sephirot-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/sephirot-3440.png

bg        = #241e16
