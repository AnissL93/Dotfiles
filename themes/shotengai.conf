# Shotengai: a painted shopping street in spring — plaster cream, sakura pink, terracotta
# shop signs, honey awning, slate shadows. shotengai-dark.conf is the street after closing.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=80 accent=10 border=45 syntax=20,250,140,330,75  (colours computed by ./design)
name            = Shotengai
mode            = light
emacs_theme     = doom-shotengai
cursor          = Shotengai
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/shotengai-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/shotengai-3440.png

bg        = #f6f3ed
bg_alt    = #efeae2
bg_hl     = #e8e2d8
sel       = #e7cdd0
dim       = #b6b0a7
mid       = #726756
fg        = #302a21
bright    = #1d170e
accent    = #84545b
accent_fg = #fbf5f6
bar       = #a6344f
bar_fg    = #fbf5f6
border    = #b94a00

comment   = #8c8579
string    = #496b42
number    = #795a2c
keyword   = #864e4f
function  = #3e6389
type      = #795075
punct     = #6b6254
err       = #9c4343
warn      = #795a2c
ok        = #3c6c53

color0  = #1d170e
color1  = #a8353e
color2  = #1d771d
color3  = #885800
color4  = #0066b3
color5  = #8e3e8f
color6  = #007378
color7  = #726756
color8  = #8c8579
color9  = #bb565a
color10 = #468d43
color11 = #a56e00
color12 = #307fc3
color13 = #a25ca2
color14 = #008c93
color15 = #302a21
