# Shotengai: a painted shopping street in spring — plaster cream, sakura pink, terracotta
# shop signs, honey awning, slate shadows. shotengai-dark.conf is the street after closing.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=watercolor base=80 accent=10 border=45 syntax=20,250,140,330,75  (colours computed by ./design)
