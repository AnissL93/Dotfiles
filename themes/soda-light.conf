# VA-11 Hall-A, light: same hues as soda.conf, light ground. Same wallpaper.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=282 base_c=.04 accent=350 border=195 syntax=350,315,195,270,30  (colours computed by ./design)
