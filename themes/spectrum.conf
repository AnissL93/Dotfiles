# Chart of Electromagnetic Radiations (1940s poster): aged cream paper, umber ink, vermilion
# headings, radio blue, spectrum bands. Light; spectrum-dark.conf is the dark version.
# Wallpaper: whole poster fitted to the height, padded with its umber frame colour.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=80 accent=35 border=50 syntax=35,265,135,330,65  (colours computed by ./design)
name            = EM Spectrum
mode            = light
emacs_theme     = doom-spectrum
cursor          = EMSpectrum
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/spectrum-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/spectrum-3440.png

bg        = #f6f3ed
bg_alt    = #efeae2
bg_hl     = #e8e2d8
sel       = #e7cec7
dim       = #b6b0a7
mid       = #726756
fg        = #302a21
bright    = #1d170e
accent    = #84564a
accent_fg = #fbf5f4
bar       = #a7391e
bar_fg    = #fbf5f4
border    = #b74d00

comment   = #8c8579
string    = #4e6a3e
