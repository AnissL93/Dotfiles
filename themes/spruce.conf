# Spruce: soft flat-vector pines and sandstone crags in yellow haze — pale lime sky, olive,
# chartreuse, slate-green trunks, sandstone.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=watercolor base=110 accent=125 border=75 syntax=135,200,110,50,30  (colours computed by ./design)
name            = Spruce Haze
mode            = light
emacs_theme     = doom-spruce
cursor          = SpruceHaze
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/spruce-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/spruce-3440.png

bg        = #f4f5e9
bg_alt    = #eceddc
bg_hl     = #e4e5d1
sel       = #ccdbb4
dim       = #b2b3a0
mid       = #6b6c46
fg        = #2c2d18
bright    = #191a06
accent    = #b7cf8e
accent_fg = #161a10
bar       = #aed561
bar_fg    = #161a10
soft      = 1
border    = #9b6500

comment   = #878870
