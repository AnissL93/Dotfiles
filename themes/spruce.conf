# Spruce: soft flat-vector pines and sandstone crags in yellow haze — pale lime sky, olive,
# chartreuse, slate-green trunks, sandstone.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=110 accent=125 border=75 syntax=135,200,110,50,30  (colours computed by ./design)
name            = Spruce Haze
mode            = light
emacs_theme     = doom-spruce
cursor          = SpruceHaze
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/spruce-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/spruce-3440.png

bg        = #f4f4ee
bg_alt    = #ebece3
bg_hl     = #e3e4d9
sel       = #cfd8c3
dim       = #b1b2a8
mid       = #6a6b57
fg        = #2c2c21
bright    = #19190f
accent    = #5b6a40
accent_fg = #f6f7f3
bar       = #526f00
bar_fg    = #f6f7f3
border    = #9b6500

comment   = #86877a
string    = #63642f
number    = #865047
keyword   = #4e6a3e
function  = #1b6d71
type      = #835338
