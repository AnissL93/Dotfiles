# Sumikko gurashi doodle pattern: pale aqua paper, pencil-brown doodles, butter-yellow stickers.
# Light; sumikko-dark.conf is the dark one. Wallpaper crops the repeating pattern (no padding).
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=198 accent=200 border=75 syntax=20,230,140,300,75  (colours computed by ./design)
name            = Sumikko
mode            = light
emacs_theme     = doom-sumikko
cursor          = Sumikko
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/sumikko-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/sumikko-3440.png

bg        = #edf5f5
bg_alt    = #e2eeee
bg_hl     = #d9e6e6
sel       = #bedbdc
dim       = #a7b4b4
mid       = #556f6f
fg        = #202e2f
bright    = #0d1b1b
accent    = #2e6e72
accent_fg = #f2f8f8
bar       = #007378
bar_fg    = #f2f8f8
border    = #9b6500

comment   = #798a8a
string    = #496b42
number    = #795a2c
keyword   = #864e4f
function  = #2c6883
type      = #675685
punct     = #546868
err       = #9c4343
warn      = #795a2c
ok        = #3c6c53

color0  = #0d1b1b
color1  = #a8353e
color2  = #1d771d
color3  = #885800
color4  = #006c9d
color5  = #7947a5
color6  = #007378
color7  = #556f6f
color8  = #798a8a
color9  = #bb565a
color10 = #468d43
color11 = #a56e00
color12 = #0085bb
color13 = #8e64b7
color14 = #008c93
color15 = #202e2f
