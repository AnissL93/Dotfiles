# Sumikko gurashi doodle pattern: pale aqua paper, pencil-brown doodles, butter-yellow stickers.
# Light; sumikko-dark.conf is the dark one. Wallpaper crops the repeating pattern (no padding).
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=watercolor base=198 accent=200 border=75 syntax=20,230,140,300,75  (colours computed by ./design)
name            = Sumikko
mode            = light
emacs_theme     = doom-sumikko
cursor          = Sumikko
wallpaper_2560  = sumikko-2560.png
wallpaper_3440  = sumikko-3440.png

bg        = #e8f7f7
