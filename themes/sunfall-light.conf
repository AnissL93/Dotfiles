# Sunfall, light: pale teal-grey mist, slate ink, sun-red highlight.
# Same wallpaper as sunfall.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=195 accent=28 accent_c=.13 border=200 syntax=25,215,165,330,65  (colours computed by ./design)
base            = sunfall
name            = Sunfall Light
mode            = light
emacs_theme     = doom-sunfall-light
cursor          = SunfallLight

bg        = #edf5f5
bg_alt    = #e3eeee
bg_hl     = #d9e6e6
sel       = #e7cdc9
dim       = #a7b4b4
mid       = #556f6e
fg        = #202e2e
bright    = #0d1b1b
accent    = #a04037
accent_fg = #fbf5f4
bar       = #a8372e
bar_fg    = #fbf5f4
border    = #008388

comment   = #798a8a
string    = #316e56
number    = #7e5730
keyword   = #864f4b
function  = #206b7b
type      = #795075
punct     = #546867
err       = #9c4343
warn      = #7e5730
ok        = #3c6c53

color0    = #0d1b1b
color1    = #a83637
color2    = #00784a
color3    = #8e5400
color4    = #006f8f
color5    = #8e3e8f
color6    = #007378
color7    = #556f6e
color8    = #798a8a
color9    = #bb5754
color10   = #019160
color11   = #ab6a00
color12   = #0088ae
color13   = #a25ca2
color14   = #008c93
color15   = #202e2e
