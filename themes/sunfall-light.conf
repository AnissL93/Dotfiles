# Sunfall, light: pale teal-grey mist, slate ink, sun-red highlight.
# Same wallpaper as sunfall.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=oil base=195 accent=28 accent_c=.13 border=200 syntax=25,215,165,330,65  (colours computed by ./design)
base            = sunfall
name            = Sunfall Light
mode            = light
emacs_theme     = doom-sunfall-light
cursor          = SunfallLight

bg        = #e9f7f6
bg_alt    = #ddf0ef
bg_hl     = #d2e8e8
sel       = #f1cac4
dim       = #a0b6b6
mid       = #457272
fg        = #163030
bright    = #031d1d
accent    = #7f211b
accent_fg = #fbf5f4
bar       = #861210
bar_fg    = #fbf5f4
soft      = 0.85
border    = #008388

comment   = #708d8c
string    = #006647
number    = #7a4702
keyword   = #843c38
function  = #006278
type      = #743f6f
punct     = #486b6a
err       = #9c4343
warn      = #7a4702
ok        = #1a6444

color0    = #031d1d
color1    = #a83637
color2    = #00784a
color3    = #8e5400
color4    = #006f8f
color5    = #8e3e8f
color6    = #007378
