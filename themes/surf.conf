# Surf: anime seaside — cerulean sea, foam white, cloud sky, sand, a far-off ship with a red hull.
# Light; surf-dark.conf is the dark version. Source is only 1280x692, upscaled (soft at 3440).
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=210 accent=225 border=185 syntax=20,235,180,290,70  (colours computed by ./design)
name            = Surf
mode            = light
emacs_theme     = doom-surf
cursor          = Surf
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/surf-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/surf-3440.png

bg        = #edf5f6
bg_alt    = #e3eef0
bg_hl     = #d9e6e8
sel       = #c0d9e3
dim       = #a7b4b6
mid       = #556e73
fg        = #202e31
bright    = #0d1b1d
accent    = #366b7f
accent_fg = #f3f8fa
bar       = #006f90
bar_fg    = #f3f8fa
border    = #00857a

comment   = #798a8d
string    = #246e62
