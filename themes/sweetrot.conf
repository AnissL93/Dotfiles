# Sweet rot: candy-gore throne room — strawberry-milk pink, syrup red, bruise violet, cream,
# mint straws and heart tears, soda purple. Light; sweetrot-dark.conf is the dark version.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=355 accent=5 border=330 syntax=15,330,175,290,60  (colours computed by ./design)
name            = Sweet Rot
mode            = light
emacs_theme     = doom-sweetrot
cursor          = SweetRot
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/sweetrot-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/sweetrot-3440.png

bg        = #f8f1f4
