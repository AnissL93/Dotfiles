# Swirl, light: paper-white page under the same cobalt ink, green hills, orange wheat. Same wallpaper as swirl.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=260 accent=260 border=145 syntax=30,250,140,300,70  (colours computed by ./design)
base            = swirl
name            = Swirl Light
mode            = light
emacs_theme     = doom-swirl-light
cursor          = SwirlLight

bg        = #f0f4f9
