# Forest Tarn, light: the fog bank — mist grey paper, spruce-green ink, boathouse red. Same wallpaper as tarn.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=220 accent=145 border=35 syntax=35,230,135,300,65  (colours computed by ./design)
base            = tarn
name            = Forest Tarn Light
mode            = light
emacs_theme     = doom-tarn-light
cursor          = ForestTarnLight

bg        = #eef5f7
bg_alt    = #e3edf1
bg_hl     = #d9e5ea
sel       = #c9dac8
dim       = #a8b3b7
mid       = #566d75
fg        = #212e32
bright    = #0e1a1e
accent    = #4b6d4c
accent_fg = #f4f8f4
bar       = #107823
bar_fg    = #f4f8f4
border    = #bc4527

comment   = #7a898e
