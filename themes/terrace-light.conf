# Terrace Night, light. Same wallpaper as terrace.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=75 accent=200 border=30 syntax=30,240,160,310,70  (colours computed by ./design)
base            = terrace
name            = Terrace Night Light
mode            = light
emacs_theme     = doom-terrace-light
cursor          = TerraceNightLight

bg        = #f7f3ed
bg_alt    = #f0eae3
bg_hl     = #e9e2d9
sel       = #bedbdc
dim       = #b7b0a7
mid       = #736756
fg        = #312a21
bright    = #1e170e
accent    = #2e6e72
accent_fg = #f2f8f8
bar       = #007378
bar_fg    = #f2f8f8
border    = #bd4334

comment   = #8d857a
string    = #366e52
number    = #7c592e
keyword   = #865047
function  = #356687
type      = #6d5480
punct     = #6b6254
err       = #9c4343
warn      = #7c592e
ok        = #3c6c53

color0  = #1e170e
color1  = #a83630
color2  = #007942
color3  = #8a5700
