# Terrace Night. Seaside terrace at dusk: navy railings, teal-green sea, a red-haired girl, cream tiles.
# Dark; terrace-light.conf is the light version.
# design: dark base=250 accent=175 border=35 syntax=30,230,165,300,75  (colours computed by ./design)
