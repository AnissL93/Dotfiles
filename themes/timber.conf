# Stacked logs in a snowy pine forest. Light: snow white with a cold blue-grey tint,
# cut-wood tan accent, frosted-pine blue border.
# color7/color15 ("white") are dark: prompts print text in bold white.
# Source: timber-original.jpg.
# design: light base=250 base_c=.008 accent=50 border=246 syntax=30,246,150,300,65  (colours computed by ./design)
