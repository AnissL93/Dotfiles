# Tonic Glass, light: frosted cool white, indigo ink highlight, ice-teal border. Same wallpaper as tonic.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=250 accent=276 border=200 syntax=20,254,190,290,60  (colours computed by ./design)
base            = tonic
name            = Tonic Glass Light
mode            = light
emacs_theme     = doom-tonic-light
cursor          = TonicGlassLight

bg        = #eff4f9
bg_alt    = #e5ecf3
bg_hl     = #dce4ec
sel       = #ced3e9
dim       = #aab2ba
mid       = #5c6b7a
fg        = #242c35
bright    = #121921
accent    = #596088
accent_fg = #f5f6fb
bar       = #4f56b7
bar_fg    = #f5f6fb
border    = #008388

comment   = #7e8792
string    = #1e6e6a
number    = #805632
keyword   = #864e4f
function  = #42628a
type      = #605988
punct     = #596571
err       = #9c4343
warn      = #805632
ok        = #3c6c53

color0  = #121921
color1  = #a8353e
color2  = #007563
color3  = #925100
color4  = #0064b5
color5  = #704aab
color6  = #007378
color7  = #5c6b7a
color8  = #7e8792
color9  = #bb565a
color10 = #00907a
color11 = #ad6800
color12 = #377dc4
color13 = #8667bc
color14 = #008c93
color15 = #242c35
