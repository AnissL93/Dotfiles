# Afternoon Train, light: same hues as train.conf, light ground. Same wallpaper.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=watercolor base=340 accent=10 border=240 syntax=5,240,140,300,50  (colours computed by ./design)
