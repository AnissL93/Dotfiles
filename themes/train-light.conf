# Afternoon Train, light: same hues as train.conf, light ground. Same wallpaper.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=340 accent=10 border=240 syntax=5,240,140,300,50  (colours computed by ./design)
base            = train
name            = Afternoon Train Light
mode            = light
emacs_theme     = doom-train-light
cursor          = AfternoonTrainLight

bg        = #f8f1f5
bg_alt    = #f1e8ee
bg_hl     = #eadfe6
sel       = #e7cdd0
dim       = #b8aeb4
mid       = #75626e
fg        = #32282e
bright    = #1e151b
accent    = #84545b
accent_fg = #fbf5f6
bar       = #a6344f
bar_fg    = #fbf5f6
border    = #0079bd

comment   = #8f828a
string    = #496b42
