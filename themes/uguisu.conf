# Uguisu: a bush warbler on a flowering plum branch, ink-and-wash. Light: rice-paper grey,
# plum-blossom pink accent, warbler-olive border, misty-mountain blue. uguisu-dark.conf is the dark one.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=watercolor base=50 accent=350 border=125 syntax=350,250,125,300,65  (colours computed by ./design)
name            = Uguisu
mode            = light
emacs_theme     = doom-uguisu
cursor          = Uguisu
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/uguisu-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/uguisu-3440.png

bg        = #fdf1ea
bg_alt    = #f8e7de
bg_hl     = #f2ded4
sel       = #f2c6d9
dim       = #c0ada3
mid       = #83604c
fg        = #3a261b
bright    = #251309
accent    = #f1accc
accent_fg = #20151a
bar       = #ff9bd1
bar_fg    = #20151a
soft      = 1
border    = #5e7f00

comment   = #988074
string    = #566d27
number    = #8a5619
keyword   = #8d4a6b
function  = #32669a
type      = #6c5594
punct     = #785c4d
err       = #9c4343
warn      = #8a5619
ok        = #2b7351

color0  = #251309
color1  = #a23461
color2  = #3f7400
color3  = #8e5400
color4  = #0066b3
color5  = #7947a5
