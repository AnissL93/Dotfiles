# Umbrella: a girl with a blue umbrella in a cluttered grey-blue room of shelves, pipes and coral
# cloth. Light: grey-blue paper, slate ink, umbrella-blue highlight, coral border; syntax coral,
# slate blue, teal, violet, ochre. umbrella-dark.conf is the dark version.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=255 base_c=.01 accent=235 border=40 syntax=35,245,200,300,70  (colours computed by ./design)
name            = Umbrella
mode            = light
emacs_theme     = doom-umbrella
cursor          = Umbrella
wallpaper_2560  = ~/System/dotfiles/themes/wallpapers/umbrella-2560.png
wallpaper_3440  = ~/System/dotfiles/themes/wallpapers/umbrella-3440.png

bg        = #f0f4f8
bg_alt    = #e7ecf2
bg_hl     = #dee3eb
sel       = #c2d8e5
dim       = #acb2b9
mid       = #5f6a77
fg        = #262c33
bright    = #131920
accent    = #3c6983
accent_fg = #f3f7fa
border    = #9b776a

comment   = #808790
string    = #1b6d71
number    = #7c592e
keyword   = #855043
function  = #396588
type      = #675685
punct     = #5c646f
err       = #9c4343
warn      = #7c592e
ok        = #3c6c53

color0  = #131920
color1  = #895151
color2  = #426f4c
color3  = #7a5e2e
color4  = #3c688b
color5  = #76557e
color6  = #1f7074
color7  = #5f6a77
color8  = #808790
color9  = #a06a69
color10 = #5c8664
color11 = #907649
color12 = #567fa1
color13 = #8d6d94
color14 = #42878b
color15 = #262c33
