# Vapor Day: light lavender version of Vapor Night — lilac paper, violet ink, purple highlight,
# pink border, the pink / cyan / mint / orange glitch accents muted to read on paper.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=295 base_c=.018 accent=294 accent_c=.09 border=359 syntax=359,285,170,210,67  (colours computed by ./design)
base            = vapor
name            = Vapor Day
mode            = light
emacs_theme     = doom-vapor-day
cursor          = VaporDay
bg        = #f4f2fb
bg_alt    = #ece9f6
