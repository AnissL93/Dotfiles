# Wakka Ghosts, light: cream bezel, ink, ghost-red highlight, teal border. Same wallpaper as wakka.conf.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=90 accent=22 border=196 syntax=22,254,150,300,70  (colours computed by ./design)
base            = wakka
name            = Wakka Ghosts Light
mode            = light
emacs_theme     = doom-wakka-light
cursor          = WakkaGhostsLight

bg        = #f6f3ed
bg_alt    = #eeebe2
bg_hl     = #e6e3d8
sel       = #e8cdcb
dim       = #b4b1a7
mid       = #706855
fg        = #2f2b20
bright    = #1c180e
accent    = #855452
accent_fg = #fbf5f5
bar       = #a8353a
bar_fg    = #fbf5f5
border    = #008385

comment   = #8b8679
string    = #3f6c49
number    = #7c592e
keyword   = #864f4d
function  = #42628a
type      = #675685
punct     = #686354
err       = #9c4343
warn      = #7c592e
ok        = #3c6c53

color0  = #1c180e
color1  = #a8353b
color2  = #00792f
color3  = #8a5700
color4  = #0064b5
color5  = #7947a5
color6  = #007376
color7  = #706855
color8  = #8b8679
color9  = #bb5757
color10 = #348f4f
color11 = #a86c00
color12 = #377dc4
color13 = #8e64b7
color14 = #008d90
