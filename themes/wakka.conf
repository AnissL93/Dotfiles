# Wakka: pixel Pac-Man chasing five ghosts on near-black — pac yellow, red, mint, blue, lilac, teal.
# Syntax hues = the ghosts. wakka-light.conf is the arcade cabinet's cream bezel.
# design: dark base=248 accent=91 border=196 syntax=22,254,150,300,85  (colours computed by ./design)
