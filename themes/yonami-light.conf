# Yonami, light: same hues as yonami.conf, light ground. Same wallpaper.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light base=165 accent=20 border=190 syntax=20,235,175,300,70  (colours computed by ./design)
base            = yonami
name            = Yonami Light
mode            = light
emacs_theme     = doom-yonami-light
cursor          = YonamiLight

bg        = #eff5f2
bg_alt    = #e4eee9
bg_hl     = #dbe6e0
sel       = #e8cdcc
dim       = #a9b4af
mid       = #596f65
fg        = #232e29
bright    = #101b16
accent    = #845454
accent_fg = #fbf5f5
bar       = #a8353e
bar_fg    = #fbf5f5
border    = #00847f

comment   = #7c8a83
string    = #286e5e
number    = #7c592e
keyword   = #864e4f
function  = #306785
type      = #675685
punct     = #576860
err       = #9c4343
warn      = #7c592e
ok        = #3c6c53

color0  = #101b16
color1  = #a8353e
color2  = #007756
color3  = #8a5700
color4  = #006ba4
color5  = #7947a5
color6  = #007472
color7  = #596f65
color8  = #7c8a83
color9  = #bb565a
color10 = #00926b
color11 = #a86c00
