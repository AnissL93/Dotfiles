# Yonami, light: same hues as yonami.conf, light ground. Same wallpaper.
# color7/color15 ("white") are dark: prompts print text in bold white.
# design: light style=oil base=165 accent=20 border=190 syntax=20,235,175,300,70  (colours computed by ./design)
base            = yonami
name            = Yonami Light
mode            = light
emacs_theme     = doom-yonami-light
cursor          = YonamiLight

bg        = #ebf7f1
bg_alt    = #e0f0e8
bg_hl     = #d5e8df
sel       = #f1c9c8
dim       = #a4b6ad
mid       = #4d7262
fg        = #1b3027
bright    = #081d15
accent    = #742d31
accent_fg = #fbf5f5
bar       = #860f23
bar_fg    = #fbf5f5
soft      = 0.85
border    = #00847f

comment   = #758d81
